name: LibSys CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build Docker Image
        run: docker build -t libsys-app .

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Automated Unit Tests (backend/api)
        run: npm run test

      - name: Start LibSys Server first for E2E Tests
        run: |
          node index.js & 
          npx wait-on http://localhost:5050 --timeout 60000
          npm run test-frontend